spring.application.name=faceguard-backend
server.port=8080
# 내 Mac에서만 접속 가능 (같은 와이파이의 다른 기기는 접속 불가). 로그인이 없어서 사진이 노출되지 않게
server.address=127.0.0.1

# AI 서버 (Week 9 FastAPI). 사진 1장에 Mac CPU 약 37초, Docker 약 86초 → 넉넉하게 5분
faceguard.ai-server-url=http://localhost:8000
faceguard.ai-timeout-seconds=300

# 사진 저장 폴더와 DB 파일 (backend/storage/, git에 올리지 않음)
faceguard.storage-dir=storage/images
spring.datasource.url=jdbc:h2:file:./storage/db/faceguard
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# 업로드 크기 (AI 서버와 같은 20MB)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB

# 개발용 DB 확인 화면: http://localhost:8080/h2-console (JDBC URL은 위 datasource.url)
spring.h2.console.enabled=true

# 시험 화면 (Swagger UI): http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
